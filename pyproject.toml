[project]
name = "TransitMind"
version = "0.1.0"
description = "A natural-language assistant for the NYC subway system"
requires-python = ">=3.11"
dependencies = [
   "fastapi",
   "uvicorn",
   "pydantic-settings",
   "structlog",
   "httpx",
   "redis",
   "qdrant-client",
   "sentence-transformers",
   "gtfs-realtime-bindings",
   "networkx",
   "anthropic",
   "openai",
   "mcp",
   "pandas",
   "langgraph"
]
[project.optional-dependencies]
dev = [
   "pytest",
   "ragas"
]
[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"
